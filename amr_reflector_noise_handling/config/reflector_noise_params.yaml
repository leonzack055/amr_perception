# 反光柱噪声处理节点参数配置 (分形维数+改进插值+圆拟合+PCA分类版本)
# Reflector Noise Handling Node Parameters (Fractal Dimension + Improved Interpolation + Circle Fit + PCA Classification Version)

reflector_noise_handling:
  ros__parameters:
    # 激光扫描话题
    scan_topic: "/scan"
    
    # 地标输出话题
    landmark_topic: "/landmark_noise"
    
    # 可视化标记话题
    marker_topic: "/reflector_noise_markers"
    
    # 补偿后点云话题（用于可视化调试）
    compensated_cloud_topic: "/compensated_cloud"
    
    # === 分类方法选择 ===
    # 分类方法: "fractal_dimension" (分形维数) 或 "pca" (主成分分析)
    classification_method: "pca"
    
    # === 阶段1: 固定强度阈值和DBSCAN ===
    # 原始强度阈值（固定值，不进行补偿或归一化）
    raw_intensity_threshold: 1000.0
    
    # === 阶段2: 分形维数过滤 ===
    fractal_dimension:
      enable: true
      # 反光柱的分形维数范围 [1.0, 1.3]
      min_fd_for_post: 1.0
      max_fd_for_post: 1.3
      # 最小点云密度（点数/面积）
      min_density: 50.0
    
    # === 阶段2: PCA形状分类 ===
    pca_classification:
      enable: true
      # 延伸度阈值 - 反光柱应该接近圆形，延伸度应该较小
      max_elongation_post: 8.50
      # 延伸度阈值 - 反光板应该有较大的延伸度
      min_elongation_board: 10.0
      # 线性度阈值 - 反光柱应该有较低的线性度
      max_linearity_post: 0.97
      # 线性度阈值 - 反光板应该有较高的线性度
      min_linearity_board: 0.94
      # 圆形度阈值 - 反光柱应该有较高的圆形度
      min_circularity_post: 0.64
      # 圆形度阈值 - 反光板应该有较低的圆形度
      min_circularity_board: 0.46
      # 最小点数
      min_points: 10
    
    # === 阶段2: 改进的插值补偿 ===
    interpolation:
      min_points: 5           # 最小点数
      max_points: 20          # 最大点数
      min_distance: 2.0       # 最小插值距离2m
      max_distance: 4.0       # 最大插值距离4m
      gap_multiplier: 0.8     # 间隙倍数
    
    # 启用插值补偿（对稀疏点云进行插值）
    enable_interpolation: false
    
    # === 阶段3: 圆拟合验证 ===
    circle_fit:
      # 最大拟合误差3cm
      max_fit_error: 0.03
      # 最小内点比例50%
      min_inlier_ratio: 0.4
      # 近距离最大误差4cm（<3m）
      max_fit_error_near: 0.04
      # 远距离最大误差2cm（>3m）
      max_fit_error_far: 0.02
      # 远距离阈值3m
      far_distance_threshold: 3.0
    
    # === 阶段3: 几何特征和描述子 ===
    # 期望的反射柱直径 (米) - 5cm
    expected_diameter: 0.05
    
    # 直径容差 (米)
    diameter_tolerance: 0.03
    
    # 最小置信度阈值
    min_confidence: 0.4
    
    # === 阶段4: 追踪系统 ===
    # 启用追踪系统（ID匹配和点云融合）
    enable_tracking: true
    
    # 追踪时间窗口（秒）- 超过此时间未检测到则删除追踪
    tracking_time_gap: 2.0
    
    # 匹配相似度阈值（0-1范围）
    match_threshold: 0.8
    
    # === 阶段5: 全局反光柱跟踪器 ===
    # 全局位置跟踪，用于ID分配和误检测过滤
    global_tracking:
      # === 数据关联参数 ===
      # 匹配距离阈值（已确认反光柱，米）
      match_distance_threshold: 0.3
      
      # 匹配距离阈值（非活跃反光柱，米）- 更宽松以允许重新匹配
      match_distance_inactive: 0.5
      
      # === 确认参数 ===
      # 确认时间窗口（秒）- 在此时间窗口内需要达到最小检测次数
      confirm_time_window: 1.0
      
      # 时间窗口内的最小检测次数
      min_detections_in_window: 8
      
      # === 状态管理参数 ===
      # 非活跃超时时间（秒）- 超过此时间未检测到，从CONFIRMED转为INACTIVE
      inactive_timeout: 5.0
      
      # 最大非活跃时间（秒）- 超过此时间未检测到，删除tracker
      max_inactive_time: 60.0
      
      # === 位置滤波参数 ===
      # EMA位置滤波系数α (0.0-1.0) - 较小的值更平滑但响应慢
      position_filter_alpha: 0.3
      
      # EMA方差估计系数β (0.0-1.0) - 用于位置不确定性估计
      position_filter_beta: 0.2
      
      # 最小标准差（米）- 避免不确定性估计过小
      min_std_dev: 0.02
      
      # 最大标准差（米）- 超过此值认为位置不确定度太高
      max_std_dev: 0.5
      
      # === 置信度滤波参数 ===
      # 最小置信度阈值 - 低于此值的检测不参与跟踪
      min_confidence_to_track: 0.3
      
      # EMA置信度滤波系数 (0.0-1.0)
      confidence_filter_alpha: 0.2
      
      # === 直径滤波参数 ===
      # EMA直径滤波系数 (0.0-1.0)
      diameter_filter_alpha: 0.3